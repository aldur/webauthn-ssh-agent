<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Use your SSH key?</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="../icons/icon-32.png" />
    <script type="module" src="sign.js"></script>
  </head>
  <body class="sign">
    <h1>Use your SSH key?</h1>
    <dl id="facts" class="facts"></dl>
    <p id="warning" class="warning hidden"></p>
    <p id="status" class="status" role="status"></p>
    <label id="skip-label" class="hidden">
      <input id="skip" type="checkbox" />
      <b>Skip the confirmation</b> from now on for direct logins to a
      verified server (also in Manage keys and settings)
    </label>
    <button id="continue" class="hidden">Continue</button>
    <button id="cancel">Cancel</button>
    <button id="deny">Deny all from this connection</button>
  </body>
</html>
