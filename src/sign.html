<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Use your SSH key?</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="../icons/icon-32.png" />
    <script type="module" src="sign.js"></script>
  </head>
  <body class="sign prompting">
    <h1>Use your SSH key?</h1>
    <dl id="facts" class="facts"></dl>
    <p id="warning" class="warning hidden"></p>
    <p id="status" class="status" role="status"></p>
    <label id="level-label" class="hidden">
      Confirmation for this key from now on:
      <select id="level">
        <option value="review">Review: show the request, wait for Continue</option>
        <option value="show">Show: show the request beside the prompt</option>
        <option value="silent">Silent: only the prompt</option>
      </select>
    </label>
    <button id="continue" class="hidden">Continue</button>
    <button id="skip">Skip this key</button>
    <button id="deny">Deny all from this connection</button>
  </body>
</html>
