# Test the extension and publish it.
#
# * Every push & pull request: unit tests, then an end-to-end test where an
#   unmodified upstream Secure Shell logs in to a real sshd through this
#   agent, with a virtual security key.
# * Pushes to main:
#   * If manifest.json's version has no release yet: publish it, tagged
#     v<version>.  So to release, change the version & push.
#   * Otherwise refresh the rolling "latest" pre-release, a development build
#     versioned <manifest.json's version>.<run number>.
#
# Third-party actions are pinned to commit hashes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Syntax check
        run: for f in src/*.js test/*.js test/e2e/*.mjs; do node --check "$f"; done

      - name: Unit tests
        run: node --test 'test/*.test.js'

      - name: Install test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
              openssh-server jq zip xz-utils
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      # Pinned upstream libapps commit (see build-secure-shell.sh).
      - name: End-to-end test
        run: ./test/e2e/run.sh

      # The dev build keeps the manifest "key" (fixed extension ID); the
      # Store build doesn't (the Store assigns the ID).
      - name: Package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(jq -r .version manifest.json)
          # A push of a version with no release yet is that release; anything
          # else is a development build.
          if [[ $GITHUB_EVENT_NAME == push ]] &&
              ! gh release view "v$version" > /dev/null 2>&1; then
            release=true
          else
            release=false
            version="$version.$GITHUB_RUN_NUMBER"
          fi
          name="webauthn-ssh-agent-$version"
          mkdir dist
          ./scripts/package.sh --version "$version" "dist/$name.zip"
          ./scripts/package.sh --version "$version" --store \
              "dist/$name-store.zip"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*.zip
          if-no-files-found: error

    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
      release: ${{ steps.package.outputs.release }}

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NAME: ${{ needs.test.outputs.name }}
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.test.outputs.name }}

      - name: Write release notes
        run: |
          cat > notes.md <<EOF
          WebAuthn SSH Agent ${VERSION}, built from ${GITHUB_SHA}.

          Most people should install it from the
          [Chrome Web Store](https://chromewebstore.google.com/detail/webauthn-ssh-agent/nkcmhjokohmhogfaanphnnfdjfplkklk).

          * \`${NAME}.zip\`: "WebAuthn SSH Agent (Dev)", for "Load
            unpacked", with a fixed extension ID
            (balijighililfegobipoacjgpmpckepg) & a black & white icon.
          * \`${NAME}-store.zip\`: for uploading to the Chrome Web Store
            (no manifest "key").

          To install the "Load unpacked" build:

          1. Download and unzip \`${NAME}.zip\` somewhere permanent.
          2. Open \`chrome://extensions\`, enable **Developer mode**, click
             **Load unpacked** and pick the unzipped folder (the one
             containing \`manifest.json\`).
          3. Click the extension's toolbar button ("Manage keys and
             settings") to add a key and set up Secure Shell.

          SHA-256:
          $(sha256sum *.zip | sed 's/^/    /')
          EOF

      - name: Publish release
        if: needs.test.outputs.release == 'true'
        run: |
          gh release create "v$VERSION" *.zip --target "$GITHUB_SHA" \
              --latest --title "WebAuthn SSH Agent $VERSION" \
              --notes-file notes.md

      - name: Update rolling "latest" pre-release
        if: needs.test.outputs.release != 'true'
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest *.zip --target "$GITHUB_SHA" \
              --prerelease --title "Development build" \
              --notes-file notes.md
